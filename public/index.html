<!DOCTYPE html>
<html lang="en">
<head>

  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ReAgent AI — Claims & Underwriting Decision Support</title>
  <meta name="description" content="ReAgent AI — agentic claims and underwriting decision-support for Kenya Reinsurance Corporation. Assess coverage, treaty clauses, claim forms, and investigation reports with cited recommendations for human review.">
  <link rel="canonical" href="/">

  <meta property="og:title" content="ReAgent AI — Claims & Underwriting Decision Support">
  <meta property="og:description" content="Agentic claims and underwriting decision-support for Kenya Reinsurance Corporation (Kenya Re AI4I Hackathon 2026).">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta property="og:image" content="LinoLogo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ReAgent AI — Claims & Underwriting Decision Support">
  <meta name="twitter:description" content="Agentic claims and underwriting decision-support for Kenya Reinsurance Corporation (Kenya Re AI4I Hackathon 2026).">
  <meta name="twitter:image" content="LinoLogo.svg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ReAgent AI",
    "url": "/",
    "logo": "LinoLogo.svg",
    "description": "Agentic claims and underwriting decision-support for Kenya Reinsurance Corporation. Assess policy, treaty, claim, and investigation documents with cited recommendations for human review."
  }
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://api.groq.com; object-src 'none'; base-uri 'self'; form-action 'self';">
  <link rel="icon" type="image/svg+xml" href="LinoBulb.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="LinoBulb.svg">
  <link rel="preload" as="image" href="LinoBulb.svg">
  <link rel="preload" as="font" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/fa-solid-900.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="chat.js" defer></script>
</head>
<body>
  <header>
    <div class="header-flex">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Open conversations" aria-expanded="false" aria-controls="sidebar">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <div class="header-brand">
        <img src="LinoLogo.svg" alt="ReAgent AI Logo" class="company-logo" />
        <span class="header-title">ReAgent AI</span>
      </div>
      <div class="header-spacer" aria-hidden="true"></div>
      <button id="mobile-new-chat-btn" class="mobile-new-chat-btn" type="button" aria-label="Start new chat">
        <i class="fas fa-plus" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <!-- Sidebar backdrop overlay for mobile -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <h3>Conversations</h3>
          <button id="sidebar-close" class="sidebar-close" aria-label="Close sidebar">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <button id="new-chat-btn" class="new-chat-btn">
          <i class="fas fa-plus"></i> New Chat
        </button>
      </div>
      
  <div class="conversations-list" id="conversations-list"></div>

      <div class="sidebar-footer">
        <div class="admin-info">
          <small>ReAgent AI · Kenya Re AI4I Hackathon 2026</small>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container" role="main">
      <div class="chat-body">
        <div id="chat-wrapper">
          <div id="chat-box" class="chat-box" aria-live="polite" aria-atomic="false"></div>
          <div id="loading-indicator" class="loading-indicator-hidden" aria-live="polite" aria-atomic="true">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
        <form id="chat-form" autocomplete="off" aria-label="Chat input area">
          <div class="input-container">
            <input
              type="text"
              id="user-input"
              placeholder="e.g. What does the treaty say about claim referral thresholds?"
              autocomplete="off"
              aria-label="Type your message"
            />
            <button id="send-btn" type="submit" aria-label="Send message">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 – ReAgent AI. Decision support only — final claim decisions require human review.</p>
  </footer>

</body>
</html>
